# Release workflow — publishes to npm via Trusted Publishing (OIDC).
#
# No npm token is used or stored. npm CLI (>= 11.5.1) exchanges the GitHub
# Actions OIDC id-token for a short-lived, package-scoped npm credential.
# This is npm's recommended replacement for 2FA-bypass publish tokens, whose
# direct-publish capability npm is removing (Phase 1 Aug 2026, Phase 2 Jan
# 2027 — github.blog changelog 2026-07-08). Provenance is attached
# automatically under trusted publishing.
#
# One-time prerequisite (npm dashboard, cannot be scripted): configure a
# Trusted Publisher for the `claude-recall` package pointing at this repo and
# this workflow filename:
#   npmjs.com -> package claude-recall -> Settings -> Trusted Publisher
#   -> GitHub Actions: org `raoulbia-ai`, repo `claude-recall`,
#      workflow `release.yml`.
#
# Trigger: push a version tag `vX.Y.Z` (must match package.json), or run
# manually via workflow_dispatch.
#
# Security model mirrors ci.yml / publish-check.yml: least-privilege
# permissions, first-party `actions/*` only. `id-token: write` is the single
# added scope, and it is what OIDC trusted publishing requires.

name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write # required to create the GitHub Release after publishing
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    name: Publish to npm (OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Install / build / test run under the runner's stock npm — the exact
      # sequence ci.yml validates green. Upgrading npm BEFORE this step breaks
      # the better-sqlite3 native install; npm is upgraded later, just for the
      # publish step, which is the only part that needs OIDC support.
      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Upgrade npm to a version that supports OIDC trusted publishing
        run: npm install -g npm@latest

      # `npm publish` fires the local prepublishOnly tarball-lint gate, then
      # publishes via the OIDC credential. Do NOT set NODE_AUTH_TOKEN —
      # trusted publishing supplies the credential itself.
      - name: Publish
        run: npm publish

      # Create a GitHub Release for the tag so maintainers and repo watchers get
      # a notification on every publish — npm's own publish email is unreliable
      # under OIDC trusted publishing (the publish isn't tied to a user account).
      # Uses the first-party gh CLI + the built-in GITHUB_TOKEN (no third-party
      # action), consistent with this workflow's security posture. Best-effort:
      # a release hiccup must never fail an otherwise-successful publish.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull this version's section out of CHANGELOG.md (from its heading up
          # to the next "## [" heading) for the release body.
          NOTES="$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md)"
          [ -z "$NOTES" ] && NOTES="Release $GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTES" \
            --verify-tag \
          || echo "::warning::GitHub Release creation failed (npm publish already succeeded)"
