# Weekly dependency update PRs. Grouped so routine minor/patch bumps arrive
# as one reviewable PR instead of ten.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    ignore:
      # commander >=15 declares node >=22.12; our support floor is 20.19.
      # It happens to RUN on 20.19 (CI passed), but shipping it makes every
      # Node 20 install print EBADENGINE warnings and breaks engine-strict
      # users. Re-allow when our own engines floor moves to 22.
      - dependency-name: commander
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
